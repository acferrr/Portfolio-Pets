<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel · ACEFER</title>
  <script src="site-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0e0c0a; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    [hidden] { display: none !important; }
    input, textarea { background: #181513; border: 1px solid rgba(255,255,255,.15); border-radius: .6rem; padding: .55rem .75rem; color: #fff; width: 100%; font-size: .875rem; }
    input:focus, textarea:focus { outline: none; border-color: #fbbf24; }
    input[type=checkbox] { width: 1.1rem; height: 1.1rem; }
    input[type=color] { width: 3rem; height: 2.5rem; padding: 2px; flex-shrink: 0; cursor: pointer; }
    input[type=range] { padding: 0; accent-color: #fbbf24; }
    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] > summary .chev { transform: rotate(180deg); }
  </style>
</head>
<body>
  <div id="toast" class="fixed bottom-5 right-5 z-50 max-w-sm rounded-xl bg-neutral-900 border border-white/15 px-4 py-3 text-sm" hidden></div>

  <!-- LOGIN -->
  <div id="login" class="min-h-screen flex items-center justify-center p-4" hidden>
    <form id="login-form" class="w-full max-w-sm bg-[#181513] border border-white/15 rounded-2xl p-6 space-y-4">
      <div>
        <div class="text-[11px] font-bold uppercase tracking-widest text-amber-400">Acesso restrito</div>
        <h1 class="text-2xl font-bold mt-1">Painel do site</h1>
      </div>
      <input id="email" type="email" placeholder="E-mail" required autocomplete="username">
      <input id="password" type="password" placeholder="Senha" required autocomplete="current-password">
      <p id="login-error" class="text-red-400 text-xs" hidden></p>
      <button id="login-btn" class="w-full py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-black text-sm font-bold">Entrar</button>
    </form>
  </div>

  <!-- EDITOR -->
  <div id="editor" hidden>
    <header class="sticky top-0 z-40 bg-[#12100e]/95 backdrop-blur border-b border-white/10">
      <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
        <div>
          <div class="font-bold">Editar site</div>
          <div id="status" class="text-xs text-white/50">Tudo salvo</div>
        </div>
        <div class="flex flex-wrap gap-2">
          <a href="./" target="_blank" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-semibold">Ver site ↗</a>
          <button id="btn-export" type="button" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-semibold">Baixar backup</button>
          <button id="btn-save" type="button" class="px-4 py-2 rounded-xl bg-emerald-400 hover:bg-emerald-300 text-black text-xs font-bold">Salvar</button>
          <button id="btn-logout" type="button" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-semibold">Sair</button>
        </div>
      </div>
    </header>
    <p class="max-w-4xl mx-auto px-4 pt-5 text-xs text-white/50">
      Dicas: cole qualquer link do YouTube (normal, Shorts ou youtu.be) e a capa sai sozinha. Vídeo sem link e seção vazia não aparecem no site. Atalho: Ctrl+S salva.
    </p>
    <main id="form" class="max-w-4xl mx-auto px-4 py-5 space-y-3"></main>
  </div>

  <script>
    const CFG = window.SITE_CONFIG || {};
    const DEFAULT = window.SITE_DEFAULT || {};
    const $ = id => document.getElementById(id);

    if (!CFG.supabaseUrl || CFG.supabaseUrl.includes('SEU-PROJETO')) {
      document.body.innerHTML = '<p style="padding:24px">Preencha a URL e a chave do Supabase no arquivo <b>site-config.js</b>.</p>';
      throw new Error('Supabase não configurado');
    }
    const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);

    let state = null;
    let dirty = false;
    const openSet = new Set();

    /* ===================== NOMES AMIGÁVEIS ===================== */
    const LABELS = {
      brandTitle: 'Nome da marca', tagline: 'Frase abaixo do nome', heroBg: 'Cor de fundo do topo', profileImg: 'Foto de perfil (topo)',
      headline: 'Título principal', subheadline: 'Subtítulo', whatsappUrl: 'Link do WhatsApp', email: 'E-mail', instagram: 'Instagram (@usuario)',
      audience: 'Seção: Para quem é', clients: 'Clientes', testimonials: 'Seção: Depoimentos', services: 'Seção: Serviços',
      compare: 'Seção: Comparativo', process: 'Seção: Processo', about: 'Seção: Quem faz (fundador)', cta: 'Seção: Chamada final',
      title: 'Título', text: 'Texto', items: 'Itens', id: 'ID (sem espaços)', kicker: 'Nicho', sub: 'Descrição', meta: 'Plataformas',
      concept: 'Projeto conceito', c: 'Cor principal', light: 'Cor clara', deep: 'Cor escura',
      heroImg: 'Imagem do card no topo',
      heroImgZoom: 'Tamanho da imagem do card (0 = automático)', heroImgX: 'Posição horizontal da imagem do card', heroImgY: 'Posição vertical da imagem do card',
      bgImg: 'Imagem de fundo da faixa', bgOpacity: 'Opacidade da imagem', gradientOpacity: 'Opacidade do degradê',
      groups: 'Grupos de vídeos', name: 'Nome', clips: 'Vídeos', label: 'Rótulo', dur: 'Duração (ex.: 0:25, opcional)',
      src: 'Link do vídeo (YouTube ou MP4)', poster: 'Capa (opcional, o YouTube gera sozinho)', desc: 'Nota interna (não aparece)',
      badge: 'Selo', tag: 'Etiqueta', bullets: 'Tópicos', theirsLabel: 'Nome do lado "comum"', oursLabel: 'Nome do seu lado',
      theirs: 'Itens do lado comum', ours: 'Seus itens', steps: 'Etapas', role: 'Cargo / empresa', photo: 'Foto do fundador',
      origin: 'De onde você é (cidade, estado)', markets: 'Mercados em que já atuou',
      companyTitle: 'Título do bloco da empresa', companyText: 'Texto sobre a ACEFER',
      video: 'Link do vídeo (opcional)', button: 'Texto do botão'
    };
    const label = k => LABELS[k] || k;

    /* Modelo usado ao clicar em "+ Adicionar" */
    const TEMPLATES = {
      'clients': { id: '', kicker: '', title: 'Novo cliente', sub: '', meta: 'Meta Ads · Reels', concept: false, c: '#3b5998', light: '#6785c4', deep: '#1e3057', heroImg: '', heroImgZoom: 0, heroImgX: 50, heroImgY: 50, bgImg: '', bgOpacity: 20, gradientOpacity: 90, groups: [{ name: '', clips: [] }] },
      'groups': { name: '', clips: [] },
      'clips': { label: 'Ad 01', dur: '', src: '', poster: '', desc: '' },
      'audience.items': { title: '', text: '' },
      'testimonials.items': { name: '', role: '', text: '', video: '' },
      'services': { badge: '', tag: '', title: '', text: '', bullets: [] },
      'process.steps': { title: '', text: '' },
      'bullets': '', 'theirs': '', 'ours': '', 'markets': ''
    };

    const COLOR_KEYS = new Set(['c', 'light', 'deep', 'heroBg']);
    const IMG_RE = /(img|photo|poster)$/i;
    const LONG_KEYS = new Set(['text', 'sub', 'subheadline', 'desc', 'companyText']);
    const RANGES = { heroImgZoom: [0, 300] };

    /* Garante os controles de imagem do card em clientes antigos */
    const CLIENT_EXTRA = { heroImgZoom: 0, heroImgX: 50, heroImgY: 50 };
    function normalizeClients() {
      state.clients = (state.clients || []).map(c => {
        if ('heroImgZoom' in c) return c;
        const out = {};
        for (const k of Object.keys(c)) { out[k] = c[k]; if (k === 'heroImg') Object.assign(out, CLIENT_EXTRA); }
        if (!('heroImgZoom' in out)) Object.assign(out, CLIENT_EXTRA);
        return out;
      });
    }

    /* ===================== UTILITÁRIOS ===================== */
    function toast(msg, err = false) {
      const t = $('toast');
      t.textContent = msg;
      t.className = `fixed bottom-5 right-5 z-50 max-w-sm rounded-xl bg-neutral-900 border px-4 py-3 text-sm ${err ? 'border-red-400/60 text-red-200' : 'border-emerald-400/50'}`;
      t.hidden = false;
      clearTimeout(window._tt);
      window._tt = setTimeout(() => { t.hidden = true; }, 4500);
    }
    function setDirty(v) {
      dirty = v;
      $('status').textContent = v ? 'Alterações não salvas' : 'Tudo salvo';
      $('status').className = 'text-xs ' + (v ? 'text-amber-300' : 'text-white/50');
    }
    window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined && text !== null) e.textContent = text;
      return e;
    }
    function btn(text, fn, disabled, cls = 'px-2 py-1 rounded bg-white/10 hover:bg-white/20 text-xs disabled:opacity-30') {
      const b = el('button', cls, text);
      b.type = 'button';
      b.disabled = !!disabled;
      b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); fn(); });
      return b;
    }
    const getAt = path => path.reduce((o, k) => o[k], state);
    function setAt(path, v) { getAt(path.slice(0, -1))[path[path.length - 1]] = v; setDirty(true); }
    function shiftHex(hex, d) {
      const n = parseInt(hex.slice(1), 16);
      const f = x => Math.min(255, Math.max(0, x + d));
      return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
    const isPlainObj = v => v && typeof v === 'object' && !Array.isArray(v);
    function mergeData(base, saved) {
      const out = { ...structuredClone(base), ...saved };
      for (const k in base) {
        if (isPlainObj(base[k]) && isPlainObj(saved[k])) out[k] = { ...structuredClone(base[k]), ...saved[k] };
      }
      return out;
    }
    function blankLike(v) {
      if (typeof v === 'string') return '';
      if (Array.isArray(v)) return [];
      if (isPlainObj(v)) {
        const o = {};
        for (const k in v) o[k] = (typeof v[k] === 'string' && !COLOR_KEYS.has(k)) ? '' : structuredClone(v[k]);
        return o;
      }
      return v;
    }
    function templateFor(path) {
      const keys = path.filter(k => typeof k === 'string');
      const t = TEMPLATES[keys.slice(-2).join('.')] ?? TEMPLATES[keys[keys.length - 1]];
      if (t !== undefined) return structuredClone(t);
      const arr = getAt(path);
      return arr.length ? blankLike(arr[0]) : '';
    }
    const itemTitle = (it, i) => typeof it === 'string' ? (it || `Item ${i + 1}`) : (it.title || it.name || it.label || `Item ${i + 1}`);

    /* ===================== UPLOAD DE IMAGEM ===================== */
    async function uploadImage(file) {
      let blob = file;
      let ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      if (/^image\/(jpeg|png|webp)$/.test(file.type)) {
        const bmp = await createImageBitmap(file);
        const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(bmp.width * scale);
        cv.height = Math.round(bmp.height * scale);
        cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
        blob = await new Promise(r => cv.toBlob(r, 'image/webp', 0.82));
        ext = 'webp';
      }
      const name = `img/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
      const { error } = await sb.storage.from(CFG.bucket).upload(name, blob, { contentType: blob.type || file.type, cacheControl: '31536000' });
      if (error) throw error;
      return sb.storage.from(CFG.bucket).getPublicUrl(name).data.publicUrl;
    }

    /* ===================== FORMULÁRIO AUTOMÁTICO ===================== */
    function render() {
      const f = $('form');
      f.innerHTML = '';
      for (const k of Object.keys(state)) f.append(node(state[k], [k]));
    }

    function node(v, path) {
      const k = path[path.length - 1];
      if (Array.isArray(v)) return arrayNode(v, path);
      if (isPlainObj(v)) {
        return group(label(k), path, body => {
          for (const kk of Object.keys(v)) body.append(node(v[kk], [...path, kk]));
        });
      }
      return field(v, path);
    }

    function group(title, path, fill, extraButtons) {
      const id = path.join('.');
      const d = el('details', 'rounded-xl bg-[#14110f] border border-white/10');
      d.open = openSet.has(id);
      d.addEventListener('toggle', () => d.open ? openSet.add(id) : openSet.delete(id));
      const s = el('summary', 'px-4 py-3 flex items-center gap-2');
      s.append(el('span', 'font-semibold text-sm flex-1 truncate', title));
      if (extraButtons) extraButtons.forEach(b => s.append(b));
      s.append(el('span', 'chev text-white/40 text-xs transition-transform', '▾'));
      const body = el('div', 'px-4 pb-4 space-y-3');
      fill(body);
      d.append(s, body);
      return d;
    }

    function arrayNode(arr, path) {
      const k = path[path.length - 1];
      return group(`${label(k)} (${arr.length})`, path, body => {
        arr.forEach((it, i) => {
          const ip = [...path, i];
          const controls = [
            btn('↑', () => move(path, i, -1), i === 0),
            btn('↓', () => move(path, i, 1), i === arr.length - 1),
            btn('✕', () => removeItem(path, i, itemTitle(it, i)), false, 'px-2 py-1 rounded bg-red-500/20 hover:bg-red-500/30 text-red-200 text-xs')
          ];
          if (isPlainObj(it)) {
            body.append(group(itemTitle(it, i), ip, b => {
              for (const kk of Object.keys(it)) b.append(node(it[kk], [...ip, kk]));
            }, controls));
          } else {
            const row = el('div', 'flex items-center gap-2');
            const inp = el('input');
            inp.value = it ?? '';
            inp.addEventListener('input', () => setAt(ip, inp.value));
            row.append(inp, ...controls);
            body.append(row);
          }
        });
        body.append(btn('+ Adicionar', () => {
          arr.push(templateFor(path));
          openSet.add(path.join('.'));
          openSet.add([...path, arr.length - 1].join('.'));
          setDirty(true);
          render();
        }, false, 'w-full py-2 rounded-lg bg-amber-400 hover:bg-amber-300 text-black text-xs font-bold'));
      });
    }

    function move(path, i, dir) {
      const a = getAt(path);
      [a[i], a[i + dir]] = [a[i + dir], a[i]];
      setDirty(true);
      render();
    }
    function removeItem(path, i, name) {
      if (!confirm(`Remover "${name}"?`)) return;
      getAt(path).splice(i, 1);
      setDirty(true);
      render();
    }

    function field(v, path) {
      const k = path[path.length - 1];
      const wrap = el('div');
      wrap.append(el('div', 'text-[11px] font-bold uppercase tracking-wider text-white/55 mb-1', label(k)));

      if (typeof v === 'boolean') {
        const inp = el('input');
        inp.type = 'checkbox';
        inp.checked = v;
        inp.addEventListener('change', () => setAt(path, inp.checked));
        wrap.append(inp);
        return wrap;
      }

      if (typeof v === 'number') {
        const row = el('div', 'flex items-center gap-3');
        const inp = el('input');
        const r = RANGES[k] || [0, 100];
        inp.type = 'range'; inp.min = r[0]; inp.max = r[1]; inp.value = v;
        const out = el('span', 'text-xs w-12 text-right', `${v}%`);
        inp.addEventListener('input', () => { setAt(path, +inp.value); out.textContent = `${inp.value}%`; });
        row.append(inp, out);
        wrap.append(row);
        return wrap;
      }

      if (COLOR_KEYS.has(k)) {
        const row = el('div', 'flex items-center gap-2');
        const color = el('input'); color.type = 'color';
        const text = el('input'); text.className = 'font-mono';
        color.value = /^#[0-9a-f]{6}$/i.test(v) ? v : '#000000';
        text.value = v || '';
        const apply = val => {
          if (!/^#[0-9a-f]{6}$/i.test(val)) return;
          setAt(path, val);
          color.value = val; text.value = val;
          const parent = getAt(path.slice(0, -1));
          if (k === 'c' && 'light' in parent && 'deep' in parent) {
            parent.light = shiftHex(val, 44);
            parent.deep = shiftHex(val, -44);
            render();
          }
        };
        color.addEventListener('change', () => apply(color.value));
        text.addEventListener('change', () => apply(text.value.trim()));
        row.append(color, text);
        wrap.append(row);
        if (k === 'c') wrap.append(el('div', 'text-[11px] text-white/40 mt-1', 'As cores clara e escura são ajustadas sozinhas.'));
        return wrap;
      }

      if (IMG_RE.test(k)) {
        const row = el('div', 'flex items-center gap-2');
        const thumb = el('img', 'w-10 h-10 rounded object-cover bg-white/5 shrink-0');
        thumb.alt = '';
        if (v) thumb.src = v; else thumb.style.visibility = 'hidden';
        const text = el('input');
        text.value = v || '';
        text.placeholder = 'Cole uma URL ou envie um arquivo';
        text.addEventListener('input', () => {
          const val = text.value.trim();
          setAt(path, val);
          thumb.src = val;
          thumb.style.visibility = val ? 'visible' : 'hidden';
        });
        const up = el('label', 'shrink-0 px-3 py-2 rounded-lg bg-amber-400 hover:bg-amber-300 text-black text-xs font-bold cursor-pointer');
        const upText = el('span', '', 'Enviar');
        const file = el('input'); file.type = 'file'; file.accept = 'image/*'; file.hidden = true;
        file.addEventListener('change', async () => {
          const f = file.files && file.files[0];
          if (!f) return;
          upText.textContent = 'Enviando…';
          try {
            const url = await uploadImage(f);
            text.value = url; thumb.src = url; thumb.style.visibility = 'visible';
            setAt(path, url);
            toast('Imagem enviada. Clique em Salvar para publicar.');
          } catch (err) {
            toast('Falha no envio: ' + (err.message || err), true);
          }
          upText.textContent = 'Enviar';
          file.value = '';
        });
        up.append(upText, file);
        row.append(thumb, text, up);
        wrap.append(row);
        return wrap;
      }

      const long = LONG_KEYS.has(k) || String(v ?? '').length > 90;
      const inp = el(long ? 'textarea' : 'input');
      if (long) inp.rows = 4;
      inp.value = v ?? '';
      inp.addEventListener('input', () => setAt(path, inp.value));
      wrap.append(inp);
      return wrap;
    }

    /* ===================== DADOS ===================== */
    async function load() {
      const { data, error } = await sb.from('site_content').select('data').eq('id', 1).maybeSingle();
      if (error) {
        toast('Erro ao carregar: ' + error.message, true);
        state = structuredClone(DEFAULT);
        normalizeClients();
        render();
        return;
      }
      if (!data || !data.data || !Object.keys(data.data).length) {
        state = structuredClone(DEFAULT);
        normalizeClients();
        render();
        setDirty(true);
        toast('Primeiro acesso: carreguei o conteúdo atual. Clique em Salvar para publicar.');
        return;
      }
      // Junta com o padrão para que campos e seções novas apareçam no painel
      state = mergeData(DEFAULT, data.data);
      normalizeClients();
      render();
      setDirty(false);
    }

    async function save() {
      const b = $('btn-save');
      b.disabled = true; b.textContent = 'Salvando…';
      const { data, error } = await sb.from('site_content')
        .update({ data: state, updated_at: new Date().toISOString() })
        .eq('id', 1).select('id');
      b.disabled = false; b.textContent = 'Salvar';
      if (error) return toast('Erro ao salvar: ' + error.message, true);
      if (!data || !data.length) return toast('Sem permissão para salvar. Confira se o e-mail da política do Supabase é o mesmo do login.', true);
      setDirty(false);
      toast('Salvo! O site já está atualizado.');
    }

    function exportBackup() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `site-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    /* ===================== LOGIN ===================== */
    function showLogin() { $('editor').hidden = true; $('login').hidden = false; }
    async function showEditor() { $('login').hidden = true; $('editor').hidden = false; await load(); }

    $('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      $('login-error').hidden = true;
      $('login-btn').textContent = 'Entrando…';
      const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
      $('login-btn').textContent = 'Entrar';
      if (error) {
        $('login-error').textContent = 'E-mail ou senha incorretos.';
        $('login-error').hidden = false;
        return;
      }
      $('password').value = '';
      showEditor();
    });

    $('btn-save').addEventListener('click', save);
    $('btn-export').addEventListener('click', exportBackup);
    $('btn-logout').addEventListener('click', async () => {
      if (dirty && !confirm('Há alterações não salvas. Sair mesmo assim?')) return;
      await sb.auth.signOut();
      setDirty(false);
      showLogin();
    });
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && !$('editor').hidden) { e.preventDefault(); save(); }
    });

    sb.auth.getSession().then(({ data: { session } }) => session ? showEditor() : showLogin());
  </script>
</body>
</html>
