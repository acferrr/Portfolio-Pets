  <style>
    :root {
      --display: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
      --text: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --cut: clamp(30px, 5.5vw, 80px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: var(--text); background: #0e0c0a; color: #fff; -webkit-font-smoothing: antialiased; overflow-x: clip; }
    [hidden] { display: none !important; }
    .font-display { font-family: var(--display); }

    .profile-fade-link { position: relative; width: 64px; height: 64px; flex-shrink: 0; border-radius: 9999px; overflow: hidden; display: block; transition: transform .22s ease; }
    .profile-fade-link:hover { transform: scale(1.06); }
    .profile-fade-img { width: 100%; height: 100%; object-fit: cover;
      -webkit-mask-image: radial-gradient(circle at 50% 46%, #000 55%, rgba(0,0,0,.48) 76%, transparent 98%);
      mask-image: radial-gradient(circle at 50% 46%, #000 55%, rgba(0,0,0,.48) 76%, transparent 98%); }

    .deck-card { position: relative; transform: rotate(var(--tilt, 0deg)); transition: transform .28s cubic-bezier(.22,1,.36,1), border-color .22s ease; will-change: transform; touch-action: manipulation; }
    .deck-card:hover, .deck-card:focus-visible, .deck-card:active { transform: rotate(0deg) translateY(-10px) scale(1.04); z-index: 30 !important; border-color: #fff; }

    .band { position: relative; isolation: isolate; background: var(--c); color: #fff;
      padding-top: calc(var(--cut) + clamp(38px, 5vw, 66px)); padding-bottom: calc(var(--cut) + 64px); }
    .band + .band { margin-top: calc(var(--cut) * -1); }
    .band:first-of-type { padding-top: clamp(48px, 6vw, 80px); }
    .band:nth-of-type(odd)  { clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--cut)), 0 100%); }
    .band:nth-of-type(even) { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 calc(100% - var(--cut))); }
    .band-img { position: absolute; inset: 0; z-index: -2; background-size: cover; background-position: center; opacity: var(--bg-op, .2); pointer-events: none; }
    .band-grad { position: absolute; inset: 0; z-index: -1;
      background-image: radial-gradient(65% 75% at 84% 25%, var(--c-light), transparent 70%), radial-gradient(55% 65% at 60% 95%, var(--c-deep), transparent 74%);
      opacity: var(--grad-op, .6);
      -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,.25) 0%, #000 68%);
      mask-image: linear-gradient(to right, rgba(0,0,0,.25) 0%, #000 68%); pointer-events: none; }

    .reel { display: flex; flex-wrap: nowrap; align-items: flex-end; gap: 14px; overflow-x: auto; padding-top: 6px; padding-bottom: 16px;
      scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.35) transparent; }
    .reel::-webkit-scrollbar { height: 5px; }
    .reel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.35); border-radius: 999px; }
    @media (max-width: 860px) {
      .reel { margin-inline: -16px; padding-inline: 16px; padding-bottom: 22px; scroll-padding-inline: 16px; }
      .reel::after { content: ""; flex: 0 0 24px; }
    }

    .clip { flex: 0 0 clamp(164px, 43vw, 204px); aspect-ratio: 9 / 16; position: relative; overflow: hidden; scroll-snap-align: start;
      border-radius: 14px; border: 1px solid rgba(255,255,255,.24);
      background: var(--poster, none) center / cover no-repeat, linear-gradient(165deg, var(--c-light, #3a3532) 0%, var(--c-deep, #141210) 100%);
      transition: transform .2s ease, border-color .2s ease; cursor: pointer; }
    .clip:hover { transform: translateY(-4px); border-color: rgba(255,255,255,.65); }
    .clip:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  <script>
    const CFG = window.SITE_CONFIG || {};
    const DEFAULT = window.SITE_DEFAULT || {};

    /* ===================== UTILITÁRIOS ===================== */
    const list = a => Array.isArray(a) ? a : [];
    const has = s => Boolean(s && String(s).trim());
    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function isDark(hex) {
      if (!/^#[0-9A-Fa-f]{6}$/.test(hex || '')) return false;
      const n = parseInt(hex.slice(1), 16);
      return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255 < 0.5;
    }
    function ytId(url) {
      const m = String(url || '').match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:embed\/|v\/|watch\?v=|shorts\/))([\w-]{11})/i);
      return m ? m[1] : '';
    }
    function playerUrl(url) {
      const id = ytId(url);
      return id
        ? { type: 'youtube', src: `https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&autoplay=1&playsinline=1` }
        : { type: 'mp4', src: url };
    }
    function posterOf(clip) {
      if (has(clip.poster)) return clip.poster;
      const id = ytId(clip.src || clip.video);
      return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : '';
    }
    // Junta o padrão com o salvo, inclusive dentro das seções (ex.: about)
    function mergeData(base, saved) {
      const out = { ...base, ...saved };
      for (const k in base) {
        const a = base[k], b = saved && saved[k];
        if (a && b && typeof a === 'object' && typeof b === 'object' && !Array.isArray(a) && !Array.isArray(b)) {
          out[k] = { ...a, ...b };
        }
      }
      return out;
    }
    function section(id, html) {
      const el = document.getElementById(id);
      el.hidden = !html;
      el.innerHTML = html || '';
    }
    const wrap = inner => `<div class="max-w-6xl mx-auto px-4 sm:px-8 py-16 sm:py-24">${inner}</div>`;
    const heading = (eyebrow, title) => `
      <div class="mb-8 sm:mb-10">
        <span class="inline-block text-xs font-bold uppercase tracking-widest text-emerald-400 mb-2">${esc(eyebrow)}</span>
        <h2 class="font-display text-4xl sm:text-5xl font-bold uppercase tracking-tight leading-none max-w-[22ch]">${esc(title)}</h2>
      </div>`;
    const waButton = (url, text) => `
      <a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2.5 px-7 py-4 rounded-full bg-emerald-500 hover:bg-emerald-400 text-neutral-950 text-xs sm:text-sm font-bold uppercase tracking-wider transition-transform active:scale-95">
        <svg class="w-4 h-4" aria-hidden="true"><use href="#i-wa"/></svg><span>${esc(text || 'Solicitar Orçamento')}</span>
      </a>`;

    function clipButton({ src, poster, label, dur, light, deep, aria }) {
      const p = poster ? `--poster:url('${esc(poster)}');` : '';
      const colors = light ? `--c-light:${esc(light)};--c-deep:${esc(deep)};` : '';
      const d = /^\d+:\d{2}$/.test(dur || '') ? `<span class="tabular-nums bg-black/40 px-1.5 py-0.5 rounded">${esc(dur)}</span>` : '';
      return `
        <button type="button" class="clip group text-left p-0" data-src="${esc(src)}" data-poster="${esc(poster)}" aria-label="${esc(aria)}" style="${colors}${p}">
          ${has(label) ? `<span class="absolute top-3 left-3 z-10 px-2 py-0.5 rounded-md bg-black/40 text-[11px] font-bold uppercase tracking-wider text-white">${esc(label)}</span>` : ''}
          <span class="absolute inset-0 z-10 m-auto w-12 h-12 rounded-full bg-white/95 flex items-center justify-center group-hover:scale-110 transition-transform" aria-hidden="true">
            <span style="border-left-color:${esc(deep || '#141210')}" class="ml-1 w-0 h-0 border-y-[8px] border-y-transparent border-l-[14px]"></span>
          </span>
          <span class="absolute bottom-3 left-3 right-3 z-10 flex justify-end text-[11px] font-semibold text-white">${d}</span>
        </button>`;
    }

    /* ===================== RENDERIZAÇÃO ===================== */
    function render(d) {
      // --- Topo ---
      const hero = document.getElementById('hero-section');
      const bg = d.heroBg || '#f6f5f2';
      const dark = isDark(bg);
      hero.style.background = bg;
      hero.style.color = dark ? '#ffffff' : '#141210';

      const insta = String(d.instagram || '').replace(/^@/, '');
      const instaUrl = `https://instagram.com/${insta}`;
      const setText = (id, v) => { document.getElementById(id).textContent = v || ''; };
      setText('brand-title', d.brandTitle);
      setText('brand-tagline', d.tagline);
      setText('footer-brand', d.brandTitle);
      setText('footer-brand-2', d.brandTitle);
      setText('footer-tagline', d.tagline);
      setText('hero-headline', d.headline);
      setText('hero-subheadline', d.subheadline);
      setText('top-email-label', d.email);
      setText('footer-email-link', d.email);
      setText('top-insta-label', `@${insta}`);
      setText('footer-insta-link', `@${insta} ↗`);
      setText('year', new Date().getFullYear());
      document.getElementById('hero-profile-img').src = d.profileImg || '';
      document.getElementById('hero-photo-link').href = instaUrl;
      document.getElementById('top-email-link').href = `mailto:${d.email}`;
      document.getElementById('footer-email-link').href = `mailto:${d.email}`;
      document.getElementById('top-insta-link').href = instaUrl;
      document.getElementById('footer-insta-link').href = instaUrl;
      document.querySelectorAll('[data-insta-pill]').forEach(a => { a.href = instaUrl; a.textContent = `@${insta}`; });
      document.querySelectorAll('[data-wa]').forEach(a => a.href = d.whatsappUrl || '#');

      // --- Para quem é ---
      const aud = d.audience || {};
      const audItems = list(aud.items).filter(i => has(i.title) || has(i.text));
      const pq = document.getElementById('para-quem');
      pq.hidden = !audItems.length;
      pq.style.borderColor = dark ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.1)';
      pq.innerHTML = audItems.length ? `
        <span class="inline-block text-xs font-bold uppercase tracking-widest ${dark ? 'text-emerald-400' : 'text-emerald-700'} mb-2">Para quem é</span>
        <h2 class="font-display text-3xl sm:text-5xl font-bold uppercase tracking-tight leading-none max-w-[22ch]">${esc(aud.title)}</h2>
        <div class="grid gap-6 sm:grid-cols-2 mt-8">
          ${audItems.map(i => `
            <article class="rounded-2xl p-5 sm:p-6 border ${dark ? 'border-white/12 bg-white/[0.04]' : 'border-black/10 bg-white/60'}">
              <h3 class="font-display text-2xl sm:text-3xl font-bold uppercase tracking-tight leading-tight">${esc(i.title)}</h3>
              <p class="mt-2 text-sm sm:text-base leading-relaxed opacity-80">${esc(i.text)}</p>
            </article>`).join('')}
        </div>` : '';

      // --- Clientes (só os que têm vídeo publicado) ---
      const clients = list(d.clients).map(c => ({
        ...c,
        groups: list(c.groups)
          .map(g => ({ ...g, clips: list(g.clips).filter(cl => has(cl.src)) }))
          .filter(g => g.clips.length)
      })).filter(c => c.groups.length);

      const angles = [-6, -2, 2, 6];
      document.getElementById('hero-fanned-deck').innerHTML = clients.map((c, i) => {
        const layer = has(c.heroImg)
          ? `<img src="${esc(c.heroImg)}" alt="" loading="lazy" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/30 to-black/15"></div>`
          : `<div class="absolute inset-0 flex items-center justify-center opacity-20 pointer-events-none" aria-hidden="true"><svg class="w-10 h-10 sm:w-14 sm:h-14 text-white" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg></div>`;
        return `
          <a href="#band-${i}" aria-label="Ver vídeos de ${esc(c.title)}"
             style="--tilt:${angles[i % angles.length]}deg;background:linear-gradient(155deg, ${esc(c.light)} 0%, ${esc(c.c)} 54%, ${esc(c.deep)} 100%);z-index:${10 + i}"
             class="deck-card ${i ? '-ml-3 sm:-ml-4' : ''} w-[82px] sm:w-[154px] md:w-[178px] h-[112px] sm:h-[182px] md:h-[204px] rounded-2xl border-2 border-white/90 overflow-hidden p-2.5 sm:p-4 flex flex-col justify-between text-left text-white shrink-0 select-none">
            ${layer}
            <div class="relative z-10"><span class="inline-block px-1.5 sm:px-2 py-0.5 rounded-full bg-black/40 text-[8px] sm:text-[10px] font-bold uppercase tracking-wider truncate max-w-full">${esc(c.kicker)}</span></div>
            <div class="relative z-10 font-display text-sm sm:text-xl font-bold uppercase leading-tight line-clamp-2">${esc(c.title)}</div>
          </a>`;
      }).join('');

      document.getElementById('cases').innerHTML = clients.map((c, i) => {
        const flip = i % 2 === 1;
        const bgOp = c.bgOpacity !== undefined ? c.bgOpacity / 100 : .2;
        const grOp = c.gradientOpacity !== undefined ? c.gradientOpacity / 100 : .6;
        const bgImg = has(c.bgImg) ? `background-image:url('${esc(c.bgImg)}');` : '';
        const groups = c.groups.map(g => `
          <div class="flex flex-col shrink-0">
            ${has(g.name) ? `<div class="text-xs font-bold uppercase tracking-widest text-white/85 mb-2">${esc(g.name)}</div>` : ''}
            <div class="flex flex-nowrap gap-3.5">
              ${g.clips.map(cl => clipButton({ src: cl.src, poster: posterOf(cl), label: cl.label, dur: cl.dur, light: c.light, deep: c.deep, aria: `Assistir ${c.title}, ${cl.label}` })).join('')}
            </div>
          </div>`).join('');
        return `
          <section id="band-${i}" class="band" style="--c:${esc(c.c)};--c-light:${esc(c.light)};--c-deep:${esc(c.deep)};z-index:${25 - i}">
            <div class="band-img" style="--bg-op:${bgOp};${bgImg}" aria-hidden="true"></div>
            <div class="band-grad" style="--grad-op:${grOp}" aria-hidden="true"></div>
            <div class="max-w-6xl mx-auto px-4 sm:px-8">
              <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
                <div class="lg:col-span-5 space-y-3 ${flip ? 'lg:order-2' : ''}">
                  <div class="flex flex-wrap items-center gap-2 text-xs font-bold uppercase tracking-widest text-white/85">
                    <span>${esc(c.kicker)}</span>
                    ${c.concept ? '<span class="px-2.5 py-0.5 rounded-full border border-white/45 text-[11px]">Projeto conceito</span>' : ''}
                  </div>
                  <h2 class="font-display text-4xl sm:text-6xl font-bold uppercase leading-[0.94] tracking-tight">${esc(c.title)}</h2>
                  ${has(c.sub) ? `<p class="font-display italic text-xl sm:text-2xl text-white/90 leading-snug">${esc(c.sub)}</p>` : ''}
                  ${has(c.meta) ? `<p class="pt-1 text-xs sm:text-sm font-semibold uppercase tracking-wider text-white/75">${esc(c.meta)}</p>` : ''}
                </div>
                <div class="lg:col-span-7 min-w-0 ${flip ? 'lg:order-1' : ''}">
                  <div class="reel">${groups}</div>
                </div>
              </div>
            </div>
          </section>`;
      }).join('');

      // --- Depoimentos ---
      const t = d.testimonials || {};
      const tItems = list(t.items).filter(x => has(x.text) || has(x.video));
      section('depoimentos', tItems.length ? wrap(`
        ${heading('Depoimentos', t.title || 'Quem já anunciou comigo')}
        <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
          ${tItems.map(x => `
            <article class="rounded-2xl bg-white/[0.04] border border-white/10 p-5 flex flex-col gap-4">
              ${has(x.video) ? `<div class="flex justify-center">${clipButton({ src: x.video, poster: posterOf({ video: x.video }), aria: `Depoimento de ${x.name || 'cliente'}` })}</div>` : ''}
              ${has(x.text) ? `<p class="text-sm leading-relaxed text-white/85">“${esc(x.text)}”</p>` : ''}
              <div class="mt-auto">
                <div class="font-display text-xl font-bold uppercase">${esc(x.name)}</div>
                ${has(x.role) ? `<div class="text-xs text-white/60">${esc(x.role)}</div>` : ''}
              </div>
            </article>`).join('')}
        </div>`) : '');

      // --- Serviços ---
      const services = list(d.services).filter(s => has(s.title));
      section('servicos', services.length ? wrap(`
        ${heading('Serviços', 'O que eu entrego')}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          ${services.map((s, i) => `
            <article class="rounded-2xl ${i === 0 ? 'bg-white/[0.05] border border-emerald-400/35' : 'bg-white/[0.03] border border-white/15'} p-6 sm:p-8">
              <div class="flex items-center justify-between gap-2 mb-4">
                ${has(s.badge) ? `<span class="px-3 py-1 rounded-full ${i === 0 ? 'bg-emerald-400 text-neutral-950' : 'bg-white/10 border border-white/20'} text-[11px] font-bold uppercase tracking-wider">${esc(s.badge)}</span>` : '<span></span>'}
                ${has(s.tag) ? `<span class="text-xs font-semibold text-white/65">${esc(s.tag)}</span>` : ''}
              </div>
              <h3 class="font-display text-3xl font-bold uppercase tracking-tight">${esc(s.title)}</h3>
              ${has(s.text) ? `<p class="text-sm text-white/80 mt-2.5 leading-relaxed">${esc(s.text)}</p>` : ''}
              <ul class="mt-5 space-y-2.5 text-xs sm:text-sm text-white/90">
                ${list(s.bullets).filter(has).map(b => `<li class="flex items-start gap-2.5"><span class="${i === 0 ? 'text-emerald-400' : 'text-amber-400'} font-bold">✓</span><span>${esc(b)}</span></li>`).join('')}
              </ul>
            </article>`).join('')}
        </div>`) : '');

      // --- Comparativo ---
      const cp = d.compare || {};
      const theirs = list(cp.theirs).filter(has), ours = list(cp.ours).filter(has);
      section('comparativo', (theirs.length || ours.length) ? wrap(`
        ${heading('A diferença', cp.title || 'O que muda')}
        <div class="grid gap-8 md:grid-cols-2">
          <div class="border-t-2 border-white/15 pt-6">
            <h3 class="font-display text-2xl font-bold uppercase text-white/50">${esc(cp.theirsLabel || 'Comum')}</h3>
            <ul class="mt-4 divide-y divide-white/10">
              ${theirs.map(x => `<li class="flex items-start gap-3 py-4 text-sm text-white/60"><span aria-hidden="true">–</span><span>${esc(x)}</span></li>`).join('')}
            </ul>
          </div>
          <div class="border-t-2 border-emerald-400 pt-6">
            <h3 class="font-display text-2xl font-bold uppercase text-emerald-400">${esc(cp.oursLabel || d.brandTitle)}</h3>
            <ul class="mt-4 divide-y divide-white/10">
              ${ours.map(x => `<li class="flex items-start gap-3 py-4 text-sm text-white"><span class="text-emerald-400 font-bold" aria-hidden="true">✓</span><span>${esc(x)}</span></li>`).join('')}
            </ul>
          </div>
        </div>
        <div class="mt-10">${waButton(d.whatsappUrl, 'Solicitar Orçamento')}</div>`) : '');

      // --- Processo ---
      const pr = d.process || {};
      const steps = list(pr.steps).filter(s => has(s.title));
      section('processo', steps.length ? wrap(`
        ${heading('Processo', pr.title || 'Como funciona')}
        <ol class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
          ${steps.map((s, i) => `
            <li class="rounded-2xl bg-white/[0.04] border border-white/10 p-5">
              <span class="font-display text-4xl font-bold text-emerald-400">${String(i + 1).padStart(2, '0')}</span>
              <h3 class="font-display text-2xl font-bold uppercase mt-2">${esc(s.title)}</h3>
              <p class="text-sm text-white/75 mt-2 leading-relaxed">${esc(s.text)}</p>
            </li>`).join('')}
        </ol>`) : '');

      // --- Quem faz (fundador + empresa) ---
      const ab = d.about || {};
      const abPhoto = has(ab.photo) ? ab.photo : d.profileImg;
      const markets = list(ab.markets).filter(has);
      const showAbout = has(ab.text) || has(ab.companyText);
      section('sobre', showAbout ? wrap(`
        ${heading('Fundador', ab.title || 'Quem faz')}
        <div class="grid gap-10 md:grid-cols-[minmax(0,360px)_1fr] items-start">
          ${has(abPhoto) ? `
            <div class="relative aspect-[4/5] overflow-hidden rounded-2xl border border-white/10">
              <img src="${esc(abPhoto)}" alt="${esc(ab.name)}" loading="lazy" class="w-full h-full object-cover">
              <span class="absolute inset-x-0 bottom-0 h-1 bg-emerald-400"></span>
            </div>` : ''}
          <div>
            <h3 class="font-display text-4xl sm:text-5xl font-bold uppercase leading-none">${esc(ab.name)}</h3>
            ${has(ab.role) ? `<p class="text-sm font-semibold text-emerald-400 mt-2">${esc(ab.role)}</p>` : ''}
            ${has(ab.origin) ? `
              <p class="mt-3 inline-flex items-center gap-1.5 text-sm text-white/70">
                <svg class="w-4 h-4" aria-hidden="true"><use href="#i-pin"/></svg>${esc(ab.origin)}
              </p>` : ''}
            ${has(ab.text) ? `<p class="mt-5 text-base leading-relaxed text-white/80 max-w-[62ch]">${esc(ab.text)}</p>` : ''}
            ${markets.length ? `
              <div class="mt-6">
                <div class="text-[11px] font-bold uppercase tracking-widest text-white/50 mb-2">Mercados em que já atuei</div>
                <div class="flex flex-wrap gap-2">
                  ${markets.map(m => `<span class="px-3 py-1.5 rounded-full bg-white/[0.06] border border-white/15 text-xs font-semibold">${esc(m)}</span>`).join('')}
                </div>
              </div>` : ''}
            ${has(ab.companyText) ? `
              <div class="mt-8 rounded-2xl bg-white/[0.04] border border-emerald-400/30 p-5 sm:p-6">
                <h4 class="font-display text-2xl font-bold uppercase text-emerald-400">${esc(ab.companyTitle || 'Sobre a empresa')}</h4>
                <p class="mt-2 text-sm sm:text-base leading-relaxed text-white/85">${esc(ab.companyText)}</p>
              </div>` : ''}
          </div>
        </div>`) : '');

      // --- Chamada final ---
      const cta = d.cta || {};
      section('chamada', has(cta.title) ? wrap(`
        <span class="inline-block text-xs font-bold uppercase tracking-widest text-emerald-400 mb-3">Próximo passo</span>
        <h2 class="font-display text-4xl sm:text-6xl font-bold uppercase tracking-tight leading-none max-w-[20ch]">${esc(cta.title)}</h2>
        <div class="mt-8">${waButton(d.whatsappUrl, cta.button)}</div>`) : '');
    }

    /* ===================== PLAYER ===================== */
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('button.clip[data-src]');
      if (!btn) return;
      const { type, src } = playerUrl(btn.dataset.src);
      const frame = document.createElement('div');
      frame.className = 'clip';
      frame.style.cursor = 'default';
      frame.innerHTML = type === 'youtube'
        ? `<iframe src="${esc(src)}" title="Vídeo" class="w-full h-full border-0 bg-black" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>`
        : `<video src="${esc(src)}" poster="${esc(btn.dataset.poster)}" class="w-full h-full object-cover bg-black" autoplay controls playsinline></video>`;
      btn.replaceWith(frame);
    });

    /* ===================== CARREGAMENTO ===================== */
    render(DEFAULT);

    if (CFG.supabaseUrl && !CFG.supabaseUrl.includes('SEU-PROJETO')) {
      fetch(`${CFG.supabaseUrl}/rest/v1/site_content?id=eq.1&select=data`, {
        headers: { apikey: CFG.supabaseAnonKey }
      })
        .then(r => r.ok ? r.json() : [])
        .then(rows => {
          const data = rows && rows[0] && rows[0].data;
          if (data && Array.isArray(data.clients)) render(mergeData(DEFAULT, data));
        })
        .catch(() => { /* mantém o conteúdo reserva */ });
    }
  </script>
</body>
</html>
